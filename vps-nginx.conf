# =============================================================================
# Arborisis — Nginx Reverse Proxy avec SSL automatique (Host VPS)
# =============================================================================
# Placez ce fichier dans /etc/nginx/sites-available/arborisis
# puis : ln -s /etc/nginx/sites-available/arborisis /etc/nginx/sites-enabled/
# =============================================================================

upstream arborisis_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP — Redirection vers HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name arborisis.com www.arborisis.com;
    
    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirection HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Configuration principale
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arborisis.com www.arborisis.com;
    
    # SSL (Certbot)
    ssl_certificate /etc/letsencrypt/live/arborisis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arborisis.com/privkey.pem;
    
    # Sécurité SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logs
    access_log /var/log/nginx/arborisis-access.log;
    error_log /var/log/nginx/arborisis-error.log;
    
    # Proxy vers l'application Docker
    location / {
        proxy_pass http://arborisis_app;
        proxy_http_version 1.1;
        
        # Headers pour Laravel
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket (Reverb)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    
    # Certbot challenge (aussi en HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Fichiers statiques (optionnel — si Nginx host sert les assets)
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     proxy_pass http://arborisis_app;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}
