# Railway injects PORT env var — default 8080
# Nginx listens on $PORT via envsubst at startup
server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Laravel public storage symlink
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # Vite built assets (immutable cache)
    location ^~ /build/ {
        alias /var/www/html/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # PWA Service Worker (no cache)
    location = /sw.js {
        alias /var/www/html/public/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Internal healthcheck (no PHP overhead)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API rate limiting
    location ^~ /api/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 512M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM via Unix socket
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;

        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
    }
}
