; PHP-FPM Pool configuration for Railway single-container deployment
[www]
user = www-data
group = www-data

; Listen on Unix socket (faster than TCP within same container)
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 120s

; Logging
access.log = /dev/null
php_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php-fpm-error.log
php_admin_flag[log_errors] = on
