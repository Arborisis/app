name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: arborisis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arborisis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: arborisis_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      AUDIO_DISK: local
      AVATAR_DISK: local
      STRIPE_PUBLIC_KEY: pk_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel directories
        run: |
          mkdir -p storage/framework/{cache,sessions,views,testing}
          mkdir -p storage/logs
          mkdir -p storage/app
          chmod -R 775 storage

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test --colors=always

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pcntl, pdo_pgsql, redis, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel directories
        run: |
          mkdir -p storage/framework/{cache,sessions,views,testing}
          mkdir -p storage/logs
          mkdir -p storage/app
          chmod -R 775 storage

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build

      - name: Run ESLint when configured
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script configured."
          fi

      - name: Run typecheck when configured
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "No typecheck script configured."
          fi

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel directories
        run: |
          mkdir -p storage/framework/{cache,sessions,views,testing}
          mkdir -p storage/logs
          mkdir -p storage/app
          chmod -R 775 storage

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi || true

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NPM audit
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  docker-build-check:
    name: Docker build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FIXME: No Dockerfile exists in this repository.
    # The Dockerfile is located in the infrastructure repository.
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-quality
      - frontend-quality
      - security-audit
      - docker-build-check

    steps:
      - name: Write summary
        run: |
          {
            echo "## Arborisis App CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Backend quality | ${{ needs.backend-quality.result }} |"
            echo "| Frontend quality | ${{ needs.frontend-quality.result }} |"
            echo "| Security audit | ${{ needs.security-audit.result }} |"
            echo "| Docker build check | ${{ needs.docker-build-check.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical job failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
